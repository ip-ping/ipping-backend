name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  # Reused by docker.yml and release.yml so a publish never skips the checks.
  workflow_call:

# Pull-request runs get no publishing credentials: nothing here can reach Docker Hub.
permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ipping
          POSTGRES_PASSWORD: ipping
          POSTGRES_DB: ipping_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL)
        env:
          IPPING_TEST_DATABASE_URL: postgresql://ipping:ipping@localhost:5432/ipping_test
        # The whole suite, including tests/test_cluster.py (two backend instances, one database).
        run: uv run pytest -q
      - name: Contracts are up to date
        run: uv run python scripts/export_contracts.py --check

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ipping-backend:ci
      - name: Image starts and reports its version
        run: docker run --rm ipping-backend:ci --version
